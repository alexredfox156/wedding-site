<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />

  <title>Доступ для Виктории Дмитриевны</title>

  <style>
    :root {
      --bg: #050505;
      --card: #0b0b0d;
      --text: #f5f5f5;
      --muted: rgba(255, 255, 255, 0.64);
      --soft: rgba(255, 255, 255, 0.42);
      --red: #b30012;
      --red-bright: #e30613;
      --line: rgba(255, 255, 255, 0.13);
      --shadow-red: rgba(179, 0, 18, 0.28);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100svh;
      display: flex;
      justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) 14px max(22px, env(safe-area-inset-bottom));
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% -10%, rgba(179, 0, 18, 0.18), transparent 34%),
        linear-gradient(180deg, #050505 0%, #090909 54%, #020202 100%);
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.09;
      background-image:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.08) 0px, rgba(255,255,255,0.08) 1px, transparent 1px, transparent 4px);
      mix-blend-mode: screen;
    }

    .page {
      width: min(100%, 520px);
      min-height: calc(100svh - 40px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .card {
      width: 100%;
      border: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.015)),
        var(--card);
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.72),
        0 0 44px var(--shadow-red);
      border-radius: 28px;
      overflow: hidden;
      animation: show 700ms ease both;
    }

    .top {
      padding: 22px 18px 18px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      position: relative;
    }

    .top::before {
      content: "";
      position: absolute;
      left: 22px;
      right: 22px;
      top: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--red-bright), transparent);
      opacity: 0.9;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 0 0 16px;
      padding: 8px 12px;
      border: 1px solid rgba(227, 6, 19, 0.48);
      border-radius: 999px;
      color: var(--text);
      background: rgba(179, 0, 18, 0.14);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red-bright);
      box-shadow: 0 0 14px var(--red-bright);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 8vw, 50px);
      line-height: 0.96;
      letter-spacing: -0.055em;
      font-weight: 900;
      text-transform: uppercase;
    }

    .red {
      display: block;
      color: var(--red-bright);
      text-shadow: 0 0 20px rgba(227, 6, 19, 0.28);
    }

    .lead {
      max-width: 390px;
      margin: 16px auto 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: 0.035em;
    }

    .video-wrap {
      padding: 14px;
      background: #000;
      position: relative;
    }

    .video-frame {
      width: 100%;
      overflow: hidden;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.14);
      background: #000;
      box-shadow: inset 0 0 0 1px rgba(227, 6, 19, 0.12);
    }

    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 68svh;
      background: #000;
    }

    .bottom {
      padding: 16px 18px 20px;
      text-align: center;
      border-top: 1px solid var(--line);
    }

    .instruction {
      margin: 0;
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .small {
      margin: 10px auto 0;
      max-width: 360px;
      color: var(--soft);
      font-size: 12px;
      line-height: 1.45;
    }

    .fallback {
      display: inline-block;
      margin-top: 14px;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(227, 6, 19, 0.75);
    }

    @keyframes show {
      from { opacity: 0; transform: translateY(12px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 420px) {
      body { padding-left: 10px; padding-right: 10px; }
      .card { border-radius: 24px; }
      .top { padding: 20px 14px 16px; }
      .lead { font-size: 13px; }
      .video-wrap { padding: 10px; }
      .video-frame { border-radius: 18px; }
      .bottom { padding: 15px 14px 18px; }
    }
  </style>
</head>

<body>
  <div class="noise" aria-hidden="true"></div>

  <main class="page">
    <section class="card" aria-label="Закрытое видео для Виктории Дмитриевны">
      <header class="top">
        <div class="badge"><span class="dot"></span>доступ разрешён</div>

        <h1>
          Виктория
          <span class="red">Дмитриевна</span>
        </h1>

        <p class="lead">
          данный материал предназначен исключительно для внимательного просмотра
        </p>
      </header>

      <div class="video-wrap">
        <div class="video-frame">
          <video controls playsinline webkit-playsinline preload="metadata" poster="img/poster.png">
            <source src="PASTE_CLOUDFLARE_R2_VIDEO_URL_HERE" type="video/quicktime" />
            Ваш браузер не поддерживает воспроизведение видео.
          </video>
        </div>
      </div>

      <footer class="bottom">
        <p class="instruction">Включить видео и смотреть до конца</p>
        <p class="small">
          Если видео не запускается внутри страницы, откройте его отдельным просмотром.
        </p>
        <a class="fallback" href="PASTE_CLOUDFLARE_R2_VIDEO_URL_HERE" target="_blank" rel="noopener">
          открыть видео отдельно
        </a>
      </footer>
    </section>
  </main>
</body>
</html>
